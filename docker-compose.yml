services:
  postgres:
    image: postgres:16
    container_name: next-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: next_erp
      POSTGRES_USER: next_erp_app
      POSTGRES_PASSWORD: next_erp_dev
    ports:
      - "5433:5432"
    volumes:
      - next_erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U next_erp_app -d next_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: next-erp-api:local-v2
    container_name: next-erp-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://next_erp_app:next_erp_dev@postgres:5432/next_erp
      PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  next_erp_postgres_data:
