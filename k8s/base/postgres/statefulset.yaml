apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: next-erp-postgres
  namespace: next-erp-dev

spec:
  serviceName: next-erp-postgres
  replicas: 1

  selector:
    matchLabels:
      app: next-erp-postgres

  template:
    metadata:
      labels:
        app: next-erp-postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16

          ports:
            - name: postgres
              containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: next_erp

            - name: POSTGRES_USER
              value: next_erp_app

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: next-erp-postgres-secret
                  key: DB_PASSWORD

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: next-erp-postgres-pvc